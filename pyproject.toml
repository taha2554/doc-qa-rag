[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "1.0.0"
description = "Ask questions about your PDFs and notes – a small RAG system built on LangChain"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "numpy>=1.26",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
